{% extends "base.html" %}
{% block title %}Live Sign Interpreter - SignBridge{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8">
        <h3>Live Sign Gesture Feed</h3>
        <div class="ratio ratio-16x9 bg-black rounded overflow-hidden position-relative">
            <video id="webcam" autoplay playsinline muted class="w-100 h-100 object-fit-cover"></video>
            <canvas id="output_canvas" class="position-absolute top-0 start-0 w-100 h-100"></canvas>
        </div>
    </div>
    <div class="col-md-4">
        <h3>Translation Output</h3>
        <div class="card p-3 mb-3 bg-light" style="min-height: 150px;">
            <h5 id="translated-text" class="text-primary fw-bold">Awaiting gesture...</h5>
            <small id="confidence-text" class="text-muted"></small>
        </div>
        <button id="speak-btn" class="btn btn-primary w-100 mb-2">Speak Translation</button>
        <a href="{{ url_for('dictionary.index') }}" class="btn btn-outline-secondary w-100">View Sign Dictionary</a>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
{% endblock %}
